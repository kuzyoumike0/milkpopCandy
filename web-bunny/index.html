<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Milkpop牧場</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ffd6e7" />

  <link rel="stylesheet" href="./style.css" />

  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          img-src 'self' data:;
          media-src 'self';
          style-src 'self' 'unsafe-inline';
          script-src 'self' 'unsafe-inline';
        ">
</head>

<body>

  <!-- ===== HUD ===== -->
  <header id="hud">
    <div id="coin">🪙 <span id="coinValue">0</span></div>

    <div id="hudButtons">
      <button id="shopBtn" type="button">お迎え</button>
      <button id="slotBtn" type="button">スロット</button>
      <button id="rankBtn" type="button">図鑑/称号</button>
      <button id="departBtn" type="button">旅立ち</button>
      <button id="resetBtn" type="button">リセット</button>
    </div>

    <div id="title"></div>
  </header>

  <!-- ===== メインフィールド ===== -->
  <main id="field">
    <!-- ★ 背景色レイヤー（最背面） -->
    <div id="bgLayer"></div>

    <!-- 天気 -->
    <div id="tenkiLayer"></div>

    <!-- ゲーム要素 -->
    <div id="bunnyLayer"></div>
    <div id="coinLayer"></div>
  </main>

  <!-- ===== BGM ===== -->
  <script type="module">
    import {
      bgmMountSettingsUI,
      bgmPlaySpecial,
      bgmClearSpecial
    } from "./BGM.js";

    bgmMountSettingsUI({ position: "top-right", title: "BGM" });

    window.BGM = {
      playSpecial: bgmPlaySpecial,
      clearSpecial: bgmClearSpecial
    };
  </script>

  <!-- ★ 背景（朝昼夜：色だけで判定） -->
  <script src="./bgcolor.js"></script>

  <!-- 天気 -->
  <script src="./tenki.js"></script>

  <!-- 花火 -->
  <script src="./hanabi.js"></script>

  <!-- 既存ロジック -->
  <script src="./app.js"></script>
  <script src="./slot.js"></script>
  <script src="./tabidati.js"></script>
  <script src="./syouhou.js"></script>
  
  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>

</body>
</html>
