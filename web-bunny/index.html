<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffd6e7" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <title>Bunny牧場</title>
</head>

<body>
  <div id="app">
    <header id="hud">
      <div id="leftHud">
        <div id="coinHud">🪙 <span id="coinValue">0</span></div>
        <div id="bunnyHud">🐰 <span id="bunnyValue">0</span></div>
      </div>

      <div id="rightHud">
        <button id="candyBtn">🍬 キャンディ</button>

        <!-- 旅立ち（ホバーで詳細） -->
        <span class="tipWrap">
          <button id="departBtn">🐰 旅立ち</button>
          <span id="departTip" class="tooltip" role="tooltip">
            10🪙 消費で うさぎを1匹送り出します。<br/>
            ※最後の1匹は旅立ちできません。
          </span>
        </span>

        <button id="rankBtn">🏆 実績</button>
        <button id="shopBtn">ショップ</button>
        <button id="resetBtn">リセット</button>
      </div>
    </header>

    <main id="field" aria-label="牧場">
      <div id="decorBack"></div>
      <div id="bunnyLayer"></div>
      <div id="coinLayer"></div>

      <div id="decorFront">
        <div class="edgeCover left"></div>
        <div class="edgeCover right"></div>
      </div>

      <div id="ground">
        <div id="groundLine"></div>
        <div id="grassStrip"></div>
      </div>

      <div id="hint" class="hidden">🍬 フィールドをクリックすると、上からキャンディを落とします（10🪙）</div>
    </main>

    <div id="modalBackdrop" class="hidden"></div>

    <!-- Shop（旅立ちはここから削除） -->
    <div id="shopModal" class="hidden" role="dialog" aria-modal="true" aria-label="ショップ">
      <div class="modalHeader">
        <div class="modalTitle">ショップ</div>
        <button id="closeShopBtn" class="iconBtn" aria-label="閉じる">✕</button>
      </div>

      <div class="modalBody">
        <div class="shopCard">
          <div class="shopItemTitle">うさぎを購入</div>
          <div class="shopItemDesc">うさぎが1匹増えます（価格は徐々に上昇）</div>

          <div class="shopRow">
            <div class="shopPrice">価格：<span id="bunnyPrice">0</span> 🪙</div>
            <button id="buyBunnyBtn" class="primary">購入</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Rank/Achievements -->
    <div id="rankModal" class="hidden" role="dialog" aria-modal="true" aria-label="実績とランキング">
      <div class="modalHeader">
        <div class="modalTitle">🏆 実績 / ランキング</div>
        <button id="closeRankBtn" class="iconBtn" aria-label="閉じる">✕</button>
      </div>

      <div class="modalBody">
        <div class="rankGrid">
          <div class="rankCard">
            <div class="rankTitle">自己ベスト</div>
            <div id="bestBox" class="rankList"></div>
          </div>

          <div class="rankCard">
            <div class="rankTitle">日別（直近）</div>
            <div id="dailyBox" class="rankList"></div>
          </div>

          <div class="rankCard wide">
            <div class="rankTitle">実績</div>
            <div id="achBox" class="achList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js?v=10"></script>
</body>
</html>
