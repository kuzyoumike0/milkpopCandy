<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Bunny牧場</title>

  <!-- viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ffd6e7" />

  <!-- style -->
  <link rel="stylesheet" href="./style.css" />

  <!-- CSP（Railway事故防止） -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          img-src 'self' data:;
          media-src 'self';
          style-src 'self' 'unsafe-inline';
          script-src 'self' 'unsafe-inline';
        ">
</head>

<body>

  <!-- ================= HUD ================= -->
  <header id="hud">
    <div id="coin">
      🪙 <span id="coinValue">2187540</span>
    </div>

    <div id="hudButtons">
      <button id="petBtn">なでる</button>

      <!-- ★ ショップ → お迎え -->
      <button id="adoptBtn">お迎え</button>

      <button id="slotBtn">スロット</button>
      <button id="bookBtn">図鑑</button>
      <button id="titleBtn">称号</button>
      <button id="departBtn">旅立ち</button>
    </div>
  </header>

  <!-- ================= FIELD ================= -->
  <main id="field">
    <div id="bunnyLayer"></div>
    <div id="coinLayer"></div>
    <div id="toastLayer"></div>
  </main>

  <!-- =================================================
       お迎え（全面表示オーバーレイ）
       ・display:none → 表示時は flex
       ・app.js 側で制御しやすいID設計
  ================================================= -->
  <section id="adoptOverlay" aria-hidden="true">
    <div class="adoptContent">
      <h1>🐰 お迎え</h1>

      <p class="adoptText">
        新しいうさぎをお迎えしますか？
      </p>

      <div class="adoptActions">
        <button id="adoptConfirmBtn" class="primary">
          お迎えする
        </button>
        <button id="adoptCancelBtn">
          やめる
        </button>
      </div>
    </div>
  </section>

  <!-- ================= BGM（朝昼夜＋旅立ち対応） ================= -->
  <script type="module">
    import {
      bgmMountSettingsUI,
      bgmPlaySpecial,
      bgmClearSpecial
    } from "./BGM.js";

    bgmMountSettingsUI({
      position: "top-right",
      title: "BGM"
    });

    window.BGM = {
      playSpecial: bgmPlaySpecial,
      clearSpecial: bgmClearSpecial
    };
  </script>

  <!-- ================= 既存JS（順序厳守） ================= -->
  <script src="./app.js"></script>
  <script src="./slot.js"></script>

  <!-- ================= Service Worker ================= -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>

</body>
</html>
