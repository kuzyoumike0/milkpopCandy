<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Milkpop牧場</title>

  <!-- viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ffd6e7" />

  <!-- style -->
  <link rel="stylesheet" href="./style.css" />

  <!-- セキュリティ系（RailwayでのCSP事故防止：最低限） -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          img-src 'self' data:;
          media-src 'self';
          style-src 'self' 'unsafe-inline';
          script-src 'self' 'unsafe-inline';
        ">
</head>

<body>
  <!-- ===== HUD（app.js が使用） ===== -->
  <header id="hud">
    <div id="coin">
      🪙 <span id="coinValue">0</span>
    </div>

    <!-- ※ app.js が探すIDに合わせる（表示名は自由） -->
    <div id="hudButtons">
      <button id="petBtn" type="button">なでる</button>

      <!-- ★ショップ→お迎え（IDは shopBtn のまま） -->
      <button id="shopBtn" type="button">お迎え</button>

      <!-- スロット：クリックして表示（slot.js 側で制御） -->
      <button id="slotBtn" type="button">スロット</button>

      <!-- 図鑑＋称号：app.js の rankBtn が openDex() を開く -->
      <button id="rankBtn" type="button">図鑑/称号</button>

      <!-- 旅立ち -->
      <button id="departBtn" type="button">旅立ち</button>

      <!-- リセット -->
      <button id="resetBtn" type="button">リセット</button>
    </div>

    <!-- 称号表示（app.js は #title があればそこに表示する） -->
    <div id="title"></div>
  </header>

  <!-- ===== メインフィールド（うさぎ表示） ===== -->
  <main id="field">
    <div id="bunnyLayer"></div>
    <div id="coinLayer"></div>
  </main>

  <!-- ===== スロットは slot.js が body 直下に自動生成 ===== -->

  <!-- ===== BGM（朝昼夜＋旅立ち対応） ===== -->
  <script type="module">
    import {
      bgmMountSettingsUI,
      bgmPlaySpecial,
      bgmClearSpecial
    } from "./BGM.js";

    // 設定UI（右上）
    bgmMountSettingsUI({ position: "top-right", title: "BGM" });

    // app.js から使えるように公開（旅立ちBGMなど）
    window.BGM = {
      playSpecial: bgmPlaySpecial,
      clearSpecial: bgmClearSpecial
    };
  </script>

  <!-- ===== 既存ロジック ===== -->
  <script src="./app.js"></script>

  <!-- ===== スロット拡張（クリックで表示にする想定） ===== -->
  <script src="./slot.js"></script>

  <!-- ===== Service Worker ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
