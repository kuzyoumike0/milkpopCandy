<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffd6e7" />

  <title>milkpop牧場</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- Style -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <!-- 🌸 左右に1つずつの柵（装飾） -->
  <img src="./assets/saku.png" class="saku-single left" alt="">
  <img src="./assets/saku.png" class="saku-single right" alt="">

  <div id="app">

    <!-- HUD -->
    <header id="hud">
      <div id="coin">🪙 <span id="coinValue">0</span></div>
      <button id="shopBtn">お迎え</button>
      <button id="rankBtn">図鑑</button>
      <button id="departBtn">旅立ち</button>
      <button id="resetBtn">リセット</button>
    </header>

    <!-- FIELD -->
    <main id="field">
      <div id="bunnyLayer"></div>
      <div id="coinLayer"></div>
    </main>

  </div>

  <!-- Script -->
  <script src="./app.js"></script>
　<script src="./slot.js"></script>

  

</body>
</html>
