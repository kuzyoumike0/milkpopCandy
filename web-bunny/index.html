<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Milkpop牧場</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ffd6e7" />

  <link rel="stylesheet" href="./style.css?v=20260110_1" />

  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          img-src 'self' data:;
          media-src 'self';
          style-src 'self' 'unsafe-inline';
          script-src 'self' 'unsafe-inline';
          font-src 'self' data:;
        ">
</head>

<body>

  <!-- ===== HUD ===== -->
  <header id="hud">
    <div id="coin">🪙 <span id="coinValue">0</span></div>

    <div id="hudButtons">
      <!-- ✅ HUDに残すのは「お迎え」「花火」だけ -->
      <button id="omukaeBtn" type="button">お迎え</button>
      <button id="hanabiBtn" type="button">🎆 花火</button>

      <!-- ✅ 互換用：DOMとしては置いてOK（見せない/押さない）。他JSが click() で呼ぶ -->
      <button id="shopBtn"     type="button" style="display:none;">ショップ</button>
      <button id="slotBtn"     type="button" style="display:none;">スロット</button>
      <button id="departBtn"   type="button" style="display:none;">旅立ち</button>
      <button id="rankBtn"     type="button" style="display:none;">ランキング</button>
      <button id="resetBtn"    type="button" style="display:none;">リセット</button>

      <!-- ✅ 追加：転生（牧場の星）互換ボタン（基本はハンバーガーメニューから呼ぶ想定） -->
      <button id="prestigeBtn" type="button" style="display:none;">転生</button>
    </div>

    <div id="title" aria-label="current-title"></div>
  </header>

  <!-- ===== メインフィールド ===== -->
  <main id="field">
    <!-- ✅ bgLayer は「背景専用」：ここにミラーボール/スポットライト等が乗る -->
    <div id="bgLayer"></div>

    <div id="tenkiLayer"></div>
    <div id="bunnyLayer"></div>
    <div id="coinLayer"></div>
    <!-- ✅ unchiLayer は unchi.js 側で自動生成（ここには書かない） -->
  </main>

  <!-- ✅ WBを先に用意（WB not found を根絶） -->
  <script src="./wb_boot.js?v=20260110_1"></script>

  <!-- ✅ 背景（朝昼夜 + ミラーボール） -->
  <script src="./bgcolor.js?v=20260110_1"></script>

  <!-- 天気 -->
  <script src="./tenki.js?v=20260110_1"></script>

  <!-- 花火（ボタンはHUDに残す） -->
  <script src="./hanabi.js?v=20260110_1"></script>

  <!-- ===== コア（WBを作る） ===== -->
  <script src="./app.js?v=20260110_1"></script>

  <!-- ✅ BGM（モーダル版：WB.bgm.openModal() 提供） -->
  <script src="./BGM.js?v=20260110_1"></script>

  <!-- ✅ うんち（app.js から分離した unchi）※BGMの後・他モジュールの前が安全 -->
  <script src="./unchi.js?v=20260110_1"></script>

  <!-- ✅ ショップ（ミラーボール購入＋設置ON/OFF） -->
  <script src="./shop.js?v=20260110_1"></script>

  <!-- ✅ アイテム配置（shop購入アイテムを赤枠で配置） -->
  <script src="./itemPlace.js?v=20260110_1"></script>

  <!-- ✅ 追加：ベッド付近で休む＋コイン微増（後付け拡張） -->
  <script src="./bed_rest_bonus.js?v=20260110_1"></script>

  <!-- ✅ 追加：ミラーボール範囲内で踊る（SE/モーション）（後付け拡張） -->
  <script src="./mirrorball_dance.js?v=20260110_1"></script>

  <!-- ===== 拡張（WB依存） ===== -->
  <script src="./zisseki.js?v=20260110_1"></script>
  <script src="./syougou.js?v=20260110_1"></script>

  <!-- ✅ 追加：転生（牧場の星） -->
  <script src="./prestige.js?v=20260110_1"></script>

  <!-- ✅ omukae は「お迎えボタン」で開く -->
  <script src="./omukae.js?v=20260110_1"></script>

  <!-- お洒落 -->
  <script src="./isyou.js?v=20260110_1"></script>

  <!-- 図鑑 -->
  <script src="./zukan.js?v=20260110_1"></script>

  <script src="./farewell_messages.js?v=20260110_1"></script>
  <script src="./tabidati.js?v=20260110_1"></script>
  <script src="./slot.js?v=20260110_1"></script>

  <!-- ✅ 右上ハンバーガーメニュー（最後に読み込む） -->
  <script src="./gameMenu.js?v=20260110_1"></script>

  <!-- ✅ 追加：互換ボタン（prestigeBtn）が押されたら転生UIを開く（安全） -->
  <script>
    (function () {
      function hook() {
        const b = document.getElementById("prestigeBtn");
        if (!b) return;

        b.addEventListener("click", function (e) {
          e.preventDefault();
          try { window.WB?.prestige?.open?.(); } catch {}
        });

        // 他JSが click() で呼ぶ用の互換
        try {
          window.WB = window.WB || {};
          window.WB.openPrestige = function () {
            try { window.WB?.prestige?.open?.(); } catch {}
          };
        } catch {}
      }
      if (document.readyState === "loading") {
        window.addEventListener("load", hook);
      } else {
        hook();
      }
    })();
  </script>

  <!-- Service Worker（安全版：復旧用に ?nosw=1 で無効化） -->
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const noSw = params.get("nosw") === "1";

      if (noSw) {
        console.warn("[SW] disabled by ?nosw=1");
        return;
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    })();
  </script>

</body>
</html>
