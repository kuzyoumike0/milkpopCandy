<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Milkpop牧場</title>

  <!-- viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ffd6e7" />

  <!-- style -->
  <link rel="stylesheet" href="./style.css" />

  <!-- CSP（Railway事故防止） -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          img-src 'self' data:;
          media-src 'self';
          style-src 'self' 'unsafe-inline';
          script-src 'self' 'unsafe-inline';
        ">
</head>

<body>

  <!-- ================= HUD ================= -->
  <header id="hud">
    <div id="coin">
      🪙 <span id="coinValue">0</span>
    </div>

    <div id="hudButtons">
      <button id="petBtn">なでる</button>
      <button id="shopBtn">ショップ</button>
      <button id="slotBtn">スロット</button>
      <button id="bookBtn">図鑑</button>
      <button id="titleBtn">称号</button>
      <button id="adoptBtn">お迎え</button>
      <button id="departBtn" class="danger">旅立ち</button>
    </div>
  </header>

  <!-- ================= FIELD ================= -->
  <main id="field">
    <div id="bunnyLayer"></div>
    <div id="coinLayer"></div>
    <div id="toastLayer"></div>
  </main>

  <!-- ================= 図鑑 ================= -->
  <section id="bookPanel" class="panel hidden">
    <h2>📖 うさぎ図鑑</h2>
    <div id="bookContent"></div>
    <button class="closeBtn">閉じる</button>
  </section>

  <!-- ================= 称号 ================= -->
  <section id="titlePanel" class="panel hidden">
    <h2>🏆 称号</h2>
    <div id="titleList"></div>
    <button class="closeBtn">閉じる</button>
  </section>

  <!-- ================= お迎え ================= -->
  <section id="adoptPanel" class="panel hidden">
    <h2>🐰 お迎え</h2>
    <p>新しいうさぎをお迎えしますか？</p>
    <button id="adoptConfirmBtn">お迎えする</button>
    <button class="closeBtn">やめる</button>
  </section>

  <!-- ================= 旅立ち ================= -->
  <section id="departPanel" class="panel hidden">
    <h2>🌸 旅立ち</h2>
    <p id="departMessage">
      このうさぎは、あなたとの日々を胸に、旅立とうとしています。
    </p>
    <button id="departConfirmBtn" class="danger">見送る</button>
    <button class="closeBtn">やめる</button>
  </section>

  <!-- ================= スロット（slot.jsが制御） ================= -->
  <!-- slot.js が body 直下に自動生成 -->

  <!-- ================= BGM（ES Module） ================= -->
  <script type="module">
    import {
      bgmMountSettingsUI,
      bgmPlaySpecial,
      bgmClearSpecial
    } from "./BGM.js";

    bgmMountSettingsUI({ position: "top-right", title: "BGM" });

    window.BGM = {
      playSpecial: bgmPlaySpecial,
      clearSpecial: bgmClearSpecial
    };
  </script>

  <!-- ================= 既存JS ================= -->
  <script src="./app.js"></script>
  <script src="./slot.js"></script>

  <!-- ================= Service Worker ================= -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>

</body>
</html>
