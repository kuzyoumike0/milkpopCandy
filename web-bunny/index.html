<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffd6e7" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <title>Bunny牧場</title>
</head>

<body>
  <div id="app">

    <!-- HUD -->
    <header id="hud">
      <div id="coin">🪙 <span id="coinValue">0</span></div>

      <!-- app.js互換用（非表示） -->
      <div id="coin-counter" style="display:none;">0</div>

      <button id="petBtn">なでる</button>
      <button id="shopBtn">ショップ</button>
      <button id="resetBtn">リセット</button>
    </header>

    <!-- フィールド -->
    <main id="field">
      <div id="bunnyLayer">
        <!-- ★ クリック対象のうさぎ -->
        <img
          src="./assets/bunny.png"
          alt="うさぎ"
          class="rabbit"
          draggable="false"
        >
      </div>

      <div id="coinLayer"></div>
    </main>

    <footer id="hint">
      放置でコインが落ちるよ／PCはカーソルを当てるだけで回収（クリック落としは1秒に1回）
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
