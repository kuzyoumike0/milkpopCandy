<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Milkpop牧場</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ffd6e7" />

  <link rel="stylesheet" href="./style.css?v=20260111_2" />

  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          img-src 'self' data:;
          media-src 'self';
          style-src 'self' 'unsafe-inline';
          script-src 'self' 'unsafe-inline';
          font-src 'self' data:;
        ">
</head>

<body>

  <!-- ===== HUD ===== -->
  <header id="hud">
    <div id="coin">🪙 <span id="coinValue">0</span></div>

    <div id="hudButtons">
      <!-- ✅ 表に出す：お迎え / 旅立ち / 花火 / おやつ -->
      <button id="omukaeBtn" type="button">お迎え</button>
      <button id="departBtn" type="button">旅立ち</button>
      <button id="hanabiBtn" type="button">🎆 花火</button>
      <button id="oyatuBtn" type="button">🍬 おやつ</button>

      <!-- ✅ 互換用：DOMとしては置いてOK（見せない/押さない）。他JSが click() で呼ぶ -->
      <button id="shopBtn"  type="button" style="display:none;">ショップ</button>
      <button id="slotBtn"  type="button" style="display:none;">スロット</button>
      <button id="rankBtn"  type="button" style="display:none;">ランキング</button>
      <button id="resetBtn" type="button" style="display:none;">リセット</button>
    </div>

    <div id="title" aria-label="current-title"></div>
  </header>

  <!-- ===== メインフィールド ===== -->
  <main id="field">
    <!-- ✅ bgLayer は「背景専用」：ここにミラーボール/スポットライト等が乗る -->
    <div id="bgLayer"></div>

    <div id="tenkiLayer"></div>
    <div id="bunnyLayer"></div>
    <div id="coinLayer"></div>
    <!-- ✅ unchiLayer は unchi.js 側で自動生成（ここには書かない） -->
  </main>

  <!-- ✅ WBを先に用意（WB not found を根絶） -->
  <script src="./wb_boot.js?v=20260111_2"></script>

  <!-- ===== コア（WBを作る）===== -->
  <script src="./app.js?v=20260111_2"></script>

  <!-- ✅ BGM（モーダル版：WB.bgm.openModal() 提供） -->
  <script src="./BGM.js?v=20260111_2"></script>

  <!-- ✅ うんち（app.js から分離した unchi）※BGMの後・他モジュールの前が安全 -->
  <script src="./unchi.js?v=20260111_2"></script>

  <!-- ✅ ショップ（ミラーボール購入＋設置ON/OFF） -->
  <script src="./shop.js?v=20260111_2"></script>

  <!-- ✅ アイテム配置（shop購入アイテムを赤枠で配置） -->
  <script src="./itemPlace.js?v=20260111_2"></script>

  <!-- ✅ おやつ -->
  <script src="./oyatu.js?v=20260111_2"></script>

  <!-- ✅ 背景（朝昼夜 + ミラーボール）
       ※ mirrorballの実DOM位置(#itemPlace_mirrorball)を拾うため itemPlace の後が安全 -->
  <script src="./bgcolor.js?v=20260111_2"></script>

  <!-- 天気 -->
  <script src="./tenki.js?v=20260111_2"></script>

  <!-- 花火（ボタンはHUDに残す） -->
  <script src="./hanabi.js?v=20260111_2"></script>

  <!-- ===== 拡張（WB依存） ===== -->
  <script src="./zisseki.js?v=20260111_2"></script>
  <script src="./syougou.js?v=20260111_2"></script>

  <!-- ✅ omukae は「お迎えボタン」で開く -->
  <script src="./omukae.js?v=20260111_2"></script>

  <!-- お洒落 -->
  <script src="./isyou.js?v=20260111_2"></script>

  <!-- 図鑑 -->
  <script src="./zukan.js?v=20260111_2"></script>

  <!-- 旅立ちメッセージ -->
  <script src="./farewell_messages.js?v=20260111_2"></script>

  <!-- 旅立ち -->
  <script src="./tabidati.js?v=20260111_2"></script>

  <!-- スロット -->
  <script src="./slot.js?v=20260111_2"></script>

  <!-- ✅ 転生（牧場の星）モーダル：gameMenu から開くので menu より前に読む -->
  <script src="./prestige.js?v=20260111_2"></script>

  <!-- ✅ 右上ハンバーガーメニュー -->
  <script src="./gameMenu.js?v=20260111_2"></script>

  <!-- ✅ 画面左右の saku（風に揺れる） -->
  <script src="./saku.js?v=20260111_2"></script>

  <!-- ✅ mirrorball_dance は「絶対に一番最後」 -->
  <script src="./mirrorball_dance.js?v=20260111_2"></script>

  <!-- Service Worker（安全版：復旧用に ?nosw=1 で無効化） -->
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const noSw = params.get("nosw") === "1";

      if (noSw) {
        console.warn("[SW] disabled by ?nosw=1");
        return;
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    })();
  </script>

</body>
</html>
