<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Milkpop牧場</title>

  <!-- viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ffd6e7" />

  <!-- style -->
  <link rel="stylesheet" href="./style.css" />

  <!-- セキュリティ系（RailwayでのCSP事故防止：最低限） -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          img-src 'self' data:;
          media-src 'self';
          style-src 'self' 'unsafe-inline';
          script-src 'self' 'unsafe-inline';
        ">
</head>

<body>
  <!-- ===== HUD（既存 app.js が使用） ===== -->
  <header id="hud">
    <div id="coin">
      🪙 <span id="coinValue">2187540</span>
    </div>
  </header>

  <!-- ===== メインフィールド（既存うさぎ表示） ===== -->
  <main id="field">
    <div id="bunnyLayer"></div>
    <div id="coinLayer"></div>
  </main>

  <!-- ===== スロットは slot.js が body 直下に自動生成 ===== -->
  <!-- ここには何も書かない -->

  <!-- ======================================================
       BGM（朝昼夜＋フェード＋設定保存＋旅立ち専用）
       ※ ES Modules を使うため type="module"
       ※ 既存 app.js / slot.js とは干渉しない
  ====================================================== -->
  <script type="module">
    import {
      bgmMountSettingsUI,
      bgmPlaySpecial,
      bgmClearSpecial
    } from "./BGM.js";

    // BGM設定UI（右上に表示）
    bgmMountSettingsUI({
      position: "top-right",
      title: "BGM"
    });

    // 既存 app.js から使えるようにグローバル公開
    window.BGM = {
      playSpecial: bgmPlaySpecial,
      clearSpecial: bgmClearSpecial
    };
  </script>

  <!-- ===== 既存ロジック（順番を変えない） ===== -->
  <script src="./app.js"></script>

  <!-- ===== スロット拡張（常に最前面） ===== -->
  <script src="./slot.js"></script>

  <!-- ===== Service Worker ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
